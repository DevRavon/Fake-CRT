<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#231929">
  <meta name="description" content="Explore Ravon Gordon's projects and get in touch. Choose a desktop or terminal experience.">
  <meta property="og:title" content="Ravon Gordon — Builder & Technologist">
  <meta property="og:description" content="Useful tools, thoughtful systems, and a little curiosity. Explore in desktop or terminal mode.">
  <meta property="og:type" content="website">
  <title>Ravon Gordon — Builder & Technologist</title>
  <link rel="icon" href="img/ravon-dev.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/site.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <section class="chooser" id="chooser" aria-labelledby="chooser-title">
      <div class="chooser-shell">
        <div class="chooser-top"><img class="chooser-logo" src="img/ravon-dev.svg" alt="Ravon.dev"><span class="chooser-kicker">SELECT AN INTERFACE</span></div>
        <div class="chooser-intro">
          <p class="eyebrow">RAVON GORDON / PERSONAL SITE</p>
          <h1 id="chooser-title">Choose your<br><em>workspace.</em></h1>
          <p>Explore my work in a desktop or terminal. Both have a direct way to contact me.</p>
        </div>
        <div class="mode-grid">
          <button class="mode-card desktop-card" data-mode="desktop" aria-label="Enter desktop mode">
            <span class="mode-card-top"><span class="mode-number">01 / VISUAL</span><span class="arrow-icon">↗</span></span>
            <span class="desktop-preview" aria-hidden="true"><span class="preview-bar"><i></i><i></i><i></i></span><span class="preview-side"><b>▦</b><b>▤</b><b>⌘</b></span><span class="preview-panel"><span class="preview-panel-title">Hello, I'm Ravon.</span><span class="preview-lines"></span><span class="preview-mini">Explore projects →</span></span></span>
            <span class="mode-card-bottom"><span><strong>Desktop</strong><small>Browse the workspace, open apps, and explore.</small></span><span class="mode-action">Launch desktop <span>→</span></span></span>
          </button>
          <button class="mode-card terminal-card" data-mode="terminal" aria-label="Enter terminal mode">
            <span class="mode-card-top"><span class="mode-number">02 / COMMAND LINE</span><span class="arrow-icon">↗</span></span>
            <span class="terminal-preview" aria-hidden="true"><span class="terminal-preview-head"><span>● ● ●</span><span>ravon@dev:~</span></span><span class="term-preview-body"><span><b>ravon@dev</b>:~$ whoami</span><span>Ravon Gordon</span><span><b>ravon@dev</b>:~$ ls</span><span class="preview-accent">about/ projects/ contact/ games/</span><span><b>ravon@dev</b>:~$ <i>▋</i></span></span></span>
            <span class="mode-card-bottom"><span><strong>Terminal</strong><small>Type commands and follow your curiosity.</small></span><span class="mode-action">Open terminal <span>→</span></span></span>
          </button>
        </div>
        <div class="chooser-footer"><span>RAVON.DEV</span><a href="mailto:admin@ravon.dev">ADMIN@RAVON.DEV <span>↗</span></a></div>
      </div>
    </section>
    <section class="workspace hidden" id="workspace" aria-label="Ravon's workspace">
      <div class="topbar"><div class="topbar-left"><button class="activities-button" id="activities-button" aria-expanded="false" aria-controls="app-launcher">☷ <span>Applications</span></button><button class="topbar-brand" id="topbar-home" aria-label="Return to mode chooser"><img src="img/ravon-dev.svg" alt=""><span>ravon.dev</span></button></div><span class="topbar-center" id="workspace-label">Desktop</span><div class="topbar-right"><button id="mode-switch" class="topbar-mode">Switch mode <span>⌘</span></button><time id="clock"></time></div></div>
      <nav class="app-launcher hidden" id="app-launcher" aria-label="App launcher"><span class="launcher-label">RAVON / APPLICATIONS</span><button data-open="files"><span>▤</span> Files</button><button data-open="about"><span>◈</span> About</button><button data-open="projects"><span>▦</span> Projects</button><button data-open="skills"><span>⌘</span> Toolkit</button><button data-open="games"><span>✳</span> Games</button><button data-open="contact"><span>✉</span> Contact</button><button data-open="terminal"><span>&gt;_</span> Terminal</button></nav>
      <div class="desktop-view hidden" id="desktop-view">
        <div class="desktop-wallpaper"><div class="wallpaper-orb orb-one"></div><div class="wallpaper-orb orb-two"></div></div>
        <nav class="dock" aria-label="Applications"><button data-open="files" title="Files" aria-label="Open Files"><span>▤</span><small>Files</small></button><button data-open="about" title="About" aria-label="Open About"><span>◈</span><small>About</small></button><button data-open="projects" title="Projects" aria-label="Open Projects"><span>▦</span><small>Projects</small></button><button data-open="games" title="Games" aria-label="Open Games"><span>✳</span><small>Games</small></button><button data-open="contact" class="dock-contact" title="Contact" aria-label="Open Contact"><span>✉</span><small>Contact</small></button><span class="dock-divider"></span><button data-open="terminal" title="Terminal" aria-label="Open Terminal"><span class="dock-terminal-icon">&gt;_</span><small>Terminal</small></button></nav>
        <div class="desktop-icons" aria-label="Desktop shortcuts"><button data-open="about"><img class="desktop-shortcut-logo" src="img/ravon-dev.svg" alt=""><span>Ravon.dev</span></button><button data-folder="/projects"><span class="folder-icon">▤</span><span>Projects</span></button><button data-folder="/games"><span class="folder-icon">▤</span><span>Games</span></button><button data-open="contact"><span class="folder-icon special">✉</span><span>Contact</span></button></div>
        <nav class="desktop-context hidden" id="desktop-context" aria-label="Desktop menu"><button data-open="files">Open Files</button><button data-open="terminal">Open Terminal</button><button data-open="contact">Contact Ravon</button><button id="desktop-reset">Reset window positions</button></nav>
      </div>
      <div class="terminal-view hidden" id="terminal-view"><div class="terminal-shell"><div class="terminal-titlebar"><span>ravon@dev: ~</span><button id="terminal-desktop" title="Switch to desktop">Desktop ↗</button></div><div class="terminal-body" id="terminal-body" role="log" aria-live="polite" aria-label="Terminal output"></div><form id="terminal-form" class="terminal-input-row" autocomplete="off"><label for="terminal-input" id="terminal-prompt">ravon@dev:~$</label><input id="terminal-input" aria-label="Terminal command" spellcheck="false" autocapitalize="off" autocomplete="off"><button type="submit" aria-label="Run command">↵</button></form></div></div>
      <div id="window-layer" class="window-layer" aria-live="off"></div>
      <div class="taskbar" id="taskbar" aria-label="Open windows"></div>
    </section>
  </main>
</body>
</html>
